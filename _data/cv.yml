    Projects:
    - name: 'Perceived Stress Scale in Midlife Adults: Reliability and Validity'
      summary: Psychometric evaluation of the PSS-10 using MIDUS biomarker data in R (Cronbach's alpha, confirmatory factor analysis, validity testing).
      highlights:
      - Confirmed a two-factor (Helplessness/Self-Efficacy) structure over a unidimensional model.
      start_date: 2026-07
      end_date: 2026-07
    - name: Predicting 10-Year Coronary Heart Disease Risk Using Machine Learning
      summary: SMOTE, KNN, random forest, and XGBoost in R on Framingham Heart Study data (n = 4,240).
      highlights:
      - Diagnosed overfitting from SMOTE-induced distributional shift (0.29 AUC drop from cross-validation to test set).
      start_date: 2026-05
      end_date: 2026-05
    - name: Assessing Depression and Memory in Older Adults (NHANES 2021-2023)
      summary: Hierarchical logistic and linear regression in Stata assessing confounding and effect modification (n = 4,683).
      highlights:
      - Found difficulty remembering/concentrating associated with depression (adjusted OR = 3.63).
      start_date: 2026-05
      end_date: 2026-05
    - name: Redlining and Health Disparities Through Agent-Based Modeling
      summary: Extended a NetLogo segregation model with an SEIR disease module and composite health score; tested 12+ policy scenarios.
      start_date: 2026-05
      end_date: 2026-05
